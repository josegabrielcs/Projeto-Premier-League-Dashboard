<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo Geral Off-white -->
  <rect width="1280" height="720" fill="#F4F5F7" />
  
  <!-- Menu Lateral -->
  <rect x="0" y="0" width="80" height="720" fill="#FFFFFF" />
  
  <!-- LINHA SUPERIOR: Segmentador + 4 KPIs (5 espaços de 202px) -->
  <rect x="100" y="20" width="202" height="81" rx="15" fill="#FFFFFF" />
  <rect x="342" y="20" width="202" height="81" rx="15" fill="#FFFFFF" />
  <rect x="585" y="20" width="202" height="81" rx="15" fill="#FFFFFF" />
  <rect x="828" y="20" width="202" height="81" rx="15" fill="#FFFFFF" />
  <rect x="1070" y="20" width="202" height="81" rx="15" fill="#FFFFFF" />
  
  <!-- COLUNA ESQUERDA -->
  <!-- Gráfico: Evolução Pontos (Altura: 302px | Largura: 550px) -->
  <rect x="100" y="121" width="550" height="302" rx="15" fill="#FFFFFF" />
  <!-- Gráfico: Contribuição em Gols (Altura: 261px | Largura: 550px) -->
  <rect x="100" y="443" width="550" height="261" rx="15" fill="#FFFFFF" />
  
  <!-- COLUNA DIREITA -->
  <!-- Gráfico: Casa x Fora (Altura: 205px | Largura: 602px) -->
  <rect x="670" y="121" width="602" height="205" rx="15" fill="#FFFFFF" />
  <!-- Tabela: Elenco (Altura: 364px | Largura: 602px) -->
  <rect x="670" y="346" width="602" height="364" rx="15" fill="#FFFFFF" />
</svg>