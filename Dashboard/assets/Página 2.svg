<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo Geral Off-white -->
  <rect width="1280" height="720" fill="#F4F5F7" />
  
  <!-- Menu Lateral -->
  <rect x="0" y="0" width="80" height="720" fill="#FFFFFF" />
  
  <!-- Cartão Esquerdo: Tabela de Classificação (Mantida com 680px de altura) -->
  <rect x="100" y="20" width="570" height="680" rx="15" fill="#FFFFFF" />
  
  <!-- Cartão Direito Superior: KPIs (Altura reduzida para 165px para dar espaço ao gráfico de baixo) -->
  <rect x="690" y="20" width="571" height="165" rx="15" fill="#FFFFFF" />
  
  <!-- Cartão Direito Inferior: Gráfico de Barras Empilhadas (Exatamente 571x495) -->
  <rect x="690" y="205" width="571" height="495" rx="15" fill="#FFFFFF" />
</svg>